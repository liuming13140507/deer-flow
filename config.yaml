config_version: 6

log_level: info

token_usage:
  enabled: false

models:
  - name: "qwen2.5:7b"
    display_name: Qwen2.5 7B (Ollama)
    use: langchain_ollama:ChatOllama
    model: "qwen2.5:7b"
    base_url: http://localhost:11434
    num_predict: 4096
    temperature: 0.7
    supports_thinking: false
    supports_vision: false

tool_groups:
  - name: web

tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5

  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10

  - name: image_search
    group: web
    use: deerflow.community.image_search.tools:image_search_tool
    max_results: 5

tool_search:
  enabled: false

uploads:
  pdf_converter: auto

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

skills:
  container_path: /mnt/skills

title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null

summarization:
  enabled: true
  model_name: null
  trigger:
    - type: tokens
      value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null

memory:
  enabled: false

skill_evolution:
  enabled: false

checkpointer:
  type: sqlite
  connection_string: checkpoints.db
